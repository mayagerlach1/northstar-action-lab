<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="365" viewBox="0 0 1120 365" role="img" aria-labelledby="title desc"><title id="title">Supplied live review and notification flow</title><desc id="desc">A person reviews and confirms a synthetic event in the browser. The app server validates the order and sends a real notification to a personal random ntfy topic. Browser-local history remembers the result. No service account or token is required; sign-in and shared Supabase persistence are optional extensions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker></defs><rect width="1120" height="365" rx="20" fill="#f6f7f3"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="38" fill="#087f8c" font-size="13" font-weight="700">02 / SUPPLIED LIVE FLOW — RUN IN YOUR DEPLOYED COPY</text><text x="32" y="72" fill="#102b46" font-size="24" font-weight="700">One deliberate confirmation sends one real synthetic event.</text><rect x="32" y="116" width="230" height="124" rx="12" fill="white" stroke="#cbd7dc"/><text x="50" y="151" fill="#102b46" font-size="20" font-weight="700">Review in browser</text><text x="50" y="182" fill="#4f6372" font-size="15">Record + title + reason</text><text x="50" y="207" fill="#4f6372" font-size="15">Confirm or cancel</text><rect x="315" y="116" width="230" height="124" rx="12" fill="white" stroke="#cbd7dc"/><text x="333" y="151" fill="#102b46" font-size="20" font-weight="700">App server</text><text x="333" y="182" fill="#4f6372" font-size="15">Validate synthetic order</text><text x="333" y="207" fill="#4f6372" font-size="15">Send real HTTP request</text><rect x="598" y="116" width="230" height="124" rx="12" fill="white" stroke="#cbd7dc"/><text x="616" y="151" fill="#102b46" font-size="20" font-weight="700">Personal ntfy topic</text><text x="616" y="182" fill="#4f6372" font-size="15">Receive notification</text><text x="616" y="207" fill="#4f6372" font-size="15">Read back to verify</text><rect x="881" y="116" width="207" height="124" rx="12" fill="white" stroke="#cbd7dc"/><text x="899" y="151" fill="#102b46" font-size="20" font-weight="700">Local outbox</text><text x="899" y="182" fill="#4f6372" font-size="15">Save state in browser</text><text x="899" y="207" fill="#4f6372" font-size="15">Retain after reload</text><path d="M268 178H305" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M551 178H588" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M834 178H871" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="279" fill="#4f6372" font-size="16">No service account or API token. A random topic is prepared locally; its first publish creates it on ntfy.</text><rect x="32" y="307" width="1056" height="36" rx="7" fill="#e6eef0"/><text x="49" y="331" fill="#102b46" font-size="15">BOUNDARY: real external message + browser-local history. No sign-in, shared database, business ticket or email.</text></g></svg>
