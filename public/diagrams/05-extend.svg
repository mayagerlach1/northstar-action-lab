<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc"><title id="title">Optional extensions beyond a verified notification</title><desc id="desc">A verified ntfy notification can lead to a GitHub issue or PR with a real file change, a Trello card, a Teams Workflow or test email, or Supabase persistence with authentication. Each extension needs its own permission and evidence and is not included in the core template.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker></defs><rect width="1120" height="430" rx="20" fill="#f6f7f3"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="38" fill="#087f8c" font-size="13" font-weight="700">05 / OPTIONAL TARGETS — CHOOSE ONE EXTENSION TO BUILD</text><text x="32" y="72" fill="#102b46" font-size="24" font-weight="700">Reuse the working pattern. Add a new capability.</text><rect x="32" y="180" width="240" height="112" rx="12" fill="#102b46" stroke="#cbd7dc"/><text x="50" y="215" fill="white" font-size="20" font-weight="700">Verified notification</text><text x="50" y="246" fill="#d4e6ec" font-size="15">Record + review + read-back</text><text x="50" y="271" fill="#d4e6ec" font-size="15">Current working template</text><path d="M278 236H332V153H388" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M338 153H742" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M332 236V302H388" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M338 302H742" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="398" y="108" width="298" height="114" rx="12" fill="white" stroke="#cbd7dc"/><text x="416" y="143" fill="#102b46" font-size="20" font-weight="700">GitHub issue or PR</text><text x="416" y="174" fill="#4f6372" font-size="15">Restricted server-side credential</text><text x="416" y="199" fill="#4f6372" font-size="15">Real issue URL or reviewed diff</text><rect x="752" y="108" width="336" height="114" rx="12" fill="white" stroke="#cbd7dc"/><text x="770" y="143" fill="#102b46" font-size="20" font-weight="700">Trello card</text><text x="770" y="174" fill="#4f6372" font-size="15">Your practice board and list</text><text x="770" y="199" fill="#4f6372" font-size="15">Authorization + actual card URL</text><rect x="398" y="260" width="298" height="114" rx="12" fill="white" stroke="#cbd7dc"/><text x="416" y="295" fill="#102b46" font-size="20" font-weight="700">Teams / test email</text><text x="416" y="326" fill="#4f6372" font-size="15">Permitted Workflow or test inbox</text><text x="416" y="351" fill="#4f6372" font-size="15">Verify the destination’s result</text><rect x="752" y="260" width="336" height="114" rx="12" fill="white" stroke="#cbd7dc"/><text x="770" y="295" fill="#102b46" font-size="20" font-weight="700">Supabase + sign-in</text><text x="770" y="326" fill="#4f6372" font-size="15">User ownership + access policies</text><text x="770" y="351" fill="#4f6372" font-size="15">Shared durable requests and history</text><text x="32" y="408" fill="#4f6372" font-size="15">These extensions are not included in the core template. Keep the original and follow-up outcomes separate.</text></g></svg>
