<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="365" viewBox="0 0 1120 365" role="img" aria-labelledby="title desc"><title id="title">Supplied ntfy send and anonymous read-back architecture</title><desc id="desc">The browser submits a request ID, order ID and reviewed text. The app server validates canonical synthetic facts and publishes JSON as a notification on ntfy. A separate anonymous poll reads the matching stored message before updating the browser-local outbox. Accepted is not verified received.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker></defs><rect width="1120" height="365" rx="20" fill="#f6f7f3"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="38" fill="#087f8c" font-size="13" font-weight="700">03 / SUPPLIED LIVE ARCHITECTURE — INSPECT AND ADAPT</text><text x="32" y="72" fill="#102b46" font-size="24" font-weight="700">A send response is a starting point. Read the stored message.</text><rect x="32" y="130" width="174" height="125" rx="12" fill="white" stroke="#cbd7dc"/><text x="50" y="165" fill="#102b46" font-size="20" font-weight="700">Browser</text><text x="50" y="196" fill="#4f6372" font-size="15">IDs + reviewed text</text><text x="50" y="221" fill="#4f6372" font-size="15">Confirm once</text><rect x="247" y="130" width="194" height="125" rx="12" fill="white" stroke="#cbd7dc"/><text x="265" y="165" fill="#102b46" font-size="20" font-weight="700">App server</text><text x="265" y="196" fill="#4f6372" font-size="15">Validate source facts</text><text x="265" y="221" fill="#4f6372" font-size="15">POST event JSON</text><rect x="482" y="130" width="174" height="125" rx="12" fill="white" stroke="#cbd7dc"/><text x="500" y="165" fill="#102b46" font-size="20" font-weight="700">ntfy topic</text><text x="500" y="196" fill="#4f6372" font-size="15">Store notification</text><text x="500" y="221" fill="#4f6372" font-size="15">Return message ID</text><rect x="697" y="130" width="174" height="125" rx="12" fill="white" stroke="#cbd7dc"/><text x="715" y="165" fill="#102b46" font-size="20" font-weight="700">Read back</text><text x="715" y="196" fill="#4f6372" font-size="15">Anonymous poll</text><text x="715" y="221" fill="#4f6372" font-size="15">Match ID + facts</text><rect x="912" y="130" width="176" height="125" rx="12" fill="white" stroke="#cbd7dc"/><text x="930" y="165" fill="#102b46" font-size="20" font-weight="700">Local outbox</text><text x="930" y="196" fill="#4f6372" font-size="15">Verified received</text><text x="930" y="221" fill="#4f6372" font-size="15">Save actual state</text><path d="M212 192H237" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M447 192H472" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M662 192H687" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M877 192H902" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="697" y="96" width="174" height="26" rx="5" fill="#087f8c"/><text x="706" y="114" fill="white" font-size="11" font-weight="700">VERIFICATION IS A READ</text><text x="32" y="291" fill="#4f6372" font-size="15">Inspect requestId, orderId, review text and server-derived facts in the stored JSON message.</text><rect x="32" y="307" width="1056" height="36" rx="7" fill="#e6eef0"/><text x="49" y="331" fill="#102b46" font-size="15">Use two live sends: baseline + adapted payload. Verify existing messages; rehearse repeated failures in simulation.</text></g></svg>
