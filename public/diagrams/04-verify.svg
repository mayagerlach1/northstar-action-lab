<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc"><title id="title">Distinguish verified receipt, rejection and unknown notification outcome</title><desc id="desc">A confirmed send can be accepted, rejected or unknown. Accepted needs an independent read-back check before receipt is verified. Check the original request ID before retrying an unknown result. Simulation offers controlled failure practice without sending. Local checks do not guarantee exactly-once delivery or durable multi-user deduplication.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker></defs><rect width="1120" height="450" rx="20" fill="#f6f7f3"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="38" fill="#087f8c" font-size="13" font-weight="700">04 / OUTCOMES — LIVE EVIDENCE AND LABELLED SIMULATION</text><text x="32" y="72" fill="#102b46" font-size="24" font-weight="700">Show what you know. Check what you do not know yet.</text><rect x="32" y="169" width="225" height="118" rx="12" fill="white" stroke="#cbd7dc"/><text x="50" y="204" fill="#102b46" font-size="20" font-weight="700">Confirmed send</text><text x="50" y="235" fill="#4f6372" font-size="15">Keep the request ID</text><text x="50" y="260" fill="#4f6372" font-size="15">Do not resend on verify</text><path d="M263 226H296V147H330" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M296 226V254H330" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M296 226V361H330" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M621 147H662" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="340" y="105" width="271" height="85" rx="12" fill="white" stroke="#cbd7dc"/><text x="358" y="140" fill="#102b46" font-size="20" font-weight="700">Send accepted</text><text x="358" y="171" fill="#4f6372" font-size="15">Read back to confirm</text><rect x="672" y="105" width="416" height="85" rx="12" fill="white" stroke="#cbd7dc"/><text x="690" y="140" fill="#102b46" font-size="20" font-weight="700">Receipt verified</text><text x="690" y="171" fill="#4f6372" font-size="15">Matched message ID + source facts</text><rect x="340" y="212" width="748" height="85" rx="12" fill="white" stroke="#cbd7dc"/><text x="358" y="247" fill="#102b46" font-size="20" font-weight="700">Send rejected</text><text x="358" y="278" fill="#4f6372" font-size="15">Explain the error. Practise this state in simulation without a live send.</text><rect x="340" y="319" width="748" height="85" rx="12" fill="white" stroke="#cbd7dc"/><text x="358" y="354" fill="#102b46" font-size="20" font-weight="700">Receipt unknown</text><text x="358" y="385" fill="#4f6372" font-size="15">Check the original request in the topic before considering a retry.</text><text x="32" y="337" fill="#4f6372" font-size="15">Keep live sends to two.</text><text x="32" y="362" fill="#4f6372" font-size="15">Use simulation for repeated</text><text x="32" y="387" fill="#4f6372" font-size="15">failure experiments.</text><text x="32" y="430" fill="#4f6372" font-size="14">Local repeat checks and best-effort read-before-send do not provide durable or exactly-once guarantees.</text></g></svg>
