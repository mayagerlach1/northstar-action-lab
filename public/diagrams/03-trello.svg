<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">02 · Assign an investigation from the segment.</title><desc id="desc">API key identifies the app. Token authorizes the action. List ID identifies the destination. Use Trello Auth → API key → Token. This manual flow needs no OAuth callback or Allowed origins.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#147d70"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#153341}.eyebrow{font-size:16px;letter-spacing:2px;fill:#147d70;font-weight:700}.title{font-size:40px;font-weight:700}.heading{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#526d75}.number{font-size:16px;font-weight:700;fill:#147d70}.note{font-size:20px}</style>
<rect width="1400" height="650" rx="24" fill="#f3f6f4"/>
<text x="44" y="62" class="eyebrow">NORTHSTAR / ACTION LAB</text>
<text x="44" y="126" class="title">02 · Assign an investigation from the segment.</text>
<text x="44" y="170" class="eyebrow">ORGANIZE WORK · TRELLO</text>
<rect x="44" y="230" width="300" height="194" rx="18" fill="white" stroke="#ccdbd8"/><circle cx="76" cy="263" r="16" fill="#e3f1ec"/><text x="76" y="269" text-anchor="middle" class="number">1</text><text x="68" y="316" class="heading">Click a chart bar</text><text x="68" y="361" class="body">Select Assign investigation</text><text x="68" y="393" class="small">Edit the scoped task</text><path d="M 348 327 H 372" fill="none" stroke="#147d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="380" y="230" width="300" height="194" rx="18" fill="white" stroke="#ccdbd8"/><circle cx="412" cy="263" r="16" fill="#e3f1ec"/><text x="412" y="269" text-anchor="middle" class="number">2</text><text x="404" y="316" class="heading">Your Vercel server</text><text x="404" y="361" class="body">API key + authorized token</text><text x="404" y="393" class="small">Uses your fixed list ID</text><path d="M 684 327 H 708" fill="none" stroke="#147d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="716" y="230" width="300" height="194" rx="18" fill="white" stroke="#ccdbd8"/><circle cx="748" cy="263" r="16" fill="#e3f1ec"/><text x="748" y="269" text-anchor="middle" class="number">3</text><text x="740" y="316" class="heading">Trello API</text><text x="740" y="361" class="body">Creates the card in your list</text><text x="740" y="393" class="small">Returns a card ID + URL</text><path d="M 1020 327 H 1044" fill="none" stroke="#147d70" stroke-width="3" marker-end="url(#arrow)"/><rect x="1052" y="230" width="300" height="194" rx="18" fill="white" stroke="#ccdbd8"/><circle cx="1084" cy="263" r="16" fill="#e3f1ec"/><text x="1084" y="269" text-anchor="middle" class="number">4</text><text x="1076" y="316" class="heading">Your Trello board</text><text x="1076" y="361" class="body">Read the card back</text><text x="1076" y="393" class="small">Match list, title and</text><text x="1076" y="420" class="small">description</text>
<rect x="44" y="464" width="1308" height="73" rx="12" fill="#e3f1ec"/>
<text x="64" y="495" class="body">API key identifies the app. Token authorizes the action. List ID identifies the destination.</text>
<text x="44" y="585" class="small">Use Trello Auth → API key → Token. This manual flow needs no OAuth callback or Allowed origins.</text>
