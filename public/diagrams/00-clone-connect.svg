<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">Your app. Your accounts. Your actions.</title><desc id="desc">Click a KPI, chart bar or record to act on that selection. Missing credentials produce clear errors. Implemented actions are the starting point. Your task is to adapt, connect and explain them.</desc>
